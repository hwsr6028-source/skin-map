name: Validate information-world site
on:
  push:
    branches: [main]
    paths:
      - "scripts/**"
      - "assets/**"
      - "data/**"
      - "content/**"
      - ".github/workflows/site-build-check.yml"
  workflow_dispatch:
jobs:
  check:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Check Python syntax
        run: python3 -m py_compile scripts/build.py
      - name: Install image build dependencies
        run: |
          python3 -m pip install -r requirements.txt
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends fonts-nanum
      - name: Build static site
        run: python3 scripts/build.py
      - name: Check key pages and sitemap
        run: |
          test -f dist/index.html
          test -f dist/about/index.html
          test -f dist/contact/index.html
          test -f dist/blog/index.html
          test -f dist/sitemap.xml
          grep -q "agency-hero" dist/index.html
