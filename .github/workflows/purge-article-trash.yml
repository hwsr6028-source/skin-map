name: Permanently purge legacy article trash
on:
  push:
    branches: [main]
    paths:
      - scripts/purge_trash.py
      - .github/workflows/purge-article-trash.yml
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: permanent-article-trash-cleanup
  cancel-in-progress: false
jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Remove all legacy trash immediately
        run: python3 scripts/purge_trash.py
      - name: Commit deletion of only trash posts and blocked slugs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A content/posts content/deleted-slugs.json
          if ! git diff --cached --quiet; then
            git commit -m "Permanently purge old trash articles and block reimport"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
