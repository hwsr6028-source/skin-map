backend:
  name: github
  repo: hwsr6028-source/skin-map
  branch: main
  base_url: https://sveltia-cms-auth.hwsr6028.workers.dev
  auth_methods: [oauth, token]

locale: ko
site_url: https://skin-map.pages.dev
display_url: https://skin-map.pages.dev

media_folder: assets/uploads
public_folder: /assets/uploads

slug:
  encoding: unicode
  lowercase: true
  sanitize_replacement: '-'
  trim: true

collections:
  - name: articles
    label: 정보세상 · 글 작성
    label_singular: 정보 글
    folder: content/posts
    create: true
    delete: true
    format: json
    extension: json
    identifier_field: title
    summary: "{{title}} | {{category}}"
    slug:
      template: "{{keyword}}"
      editable: [create]
      hint: "핵심 키워드를 기준으로 주소를 자동 생성합니다. 새 글 저장 전에 주소를 확인할 수 있습니다."
    fields:
      - name: category
        label: "① 카테고리"
        widget: select
        options:
          - { label: "병원·건강", value: health }
          - { label: "법률", value: law }
          - { label: "인테리어", value: interior }
          - { label: "이사·생활", value: moving }
          - { label: "부동산", value: realestate }
          - { label: "금융·경제", value: finance }
          - { label: "IT·디지털", value: tech }
          - { label: "교육·취업", value: education }
          - { label: "여행·취미", value: travel }
          - { label: "비즈니스·기타", value: general }
          - { label: "기존 피부과 정보", value: dermatology }
          - { label: "기존 리프팅", value: lifting }
          - { label: "기존 스킨부스터", value: skinbooster }
          - { label: "기존 기타 시술", value: other }
        default: general
      - name: keyword
        label: "② 핵심 검색 키워드 (자동 URL)"
        widget: string
        required: true
        hint: "예) 강남 이사 비용 → /blog/강남-이사-비용/ (띄어쓰기만 입력하세요)"
      - name: title
        label: "③ 글 제목 (SEO 타이틀)"
        widget: string
        hint: "예) 강남 이사 비용 총정리 | 견적 비교 및 준비 체크리스트"
      - name: description
        label: "④ 검색 결과 요약 (메타디스크립션)"
        widget: text
        hint: "글을 소개하는 100~150자 내외의 설명을 작성하세요."
      - name: thumbnail
        label: "⑤ 대표 이미지 (썸네일)"
        widget: image
        required: false
        hint: "블로그 목록에 표시됩니다. 비워두면 본문 첫 이미지를 사용합니다."
      - name: body
        label: "⑥ 글 본문"
        widget: markdown
        hint: "소제목, 이미지, FAQ를 자유롭게 작성하세요. 예) ## 이사 비용 비교"
      - name: region
        label: "지역명 (선택)"
        widget: string
        required: false
        hint: "지역 관련 글인 경우만 입력: 강남, 수원 등"
      - name: procedure
        label: "세부 주제 (선택)"
        widget: string
        required: false
        hint: "예) 이사 견적, 임대차 계약, 건강검진"
      - name: date
        label: "작성일"
        widget: datetime
        format: "YYYY-MM-DD"
        time_format: false
      - name: status
        label: "발행 상태"
        widget: select
        options:
          - { label: "임시저장 (사이트에 미노출)", value: draft }
          - { label: "홈페이지에 공개", value: published }
        default: draft
      - name: seo_approved
        label: "검색 노출 허용 (Google·Naver)"
        widget: boolean
        default: true
        hint: "새 글은 기본적으로 검색 허용입니다. 공개 전 사실 확인과 출처 검토를 완료하세요. 비공개·검토 중 글은 끄세요."
