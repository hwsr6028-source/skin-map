<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>정보세상 | 게시글 관리</title>
<style>
:root{font-family:system-ui,"Noto Sans KR",sans-serif;color:#20272a;background:#f6f7f8}*{box-sizing:border-box}body{margin:0}.wrap{max-width:1120px;margin:35px auto;padding:0 18px}header,.toolbar,.actions,.filters{display:flex;align-items:center;gap:12px;flex-wrap:wrap}header{justify-content:space-between}h1{font-size:24px;margin:0}p,.muted{color:#647178;font-size:13px}a{color:#247255}button,select,input{font:inherit;border:1px solid #d3dadd;background:white;border-radius:6px;padding:9px 12px}button{cursor:pointer}button:disabled{opacity:.4;cursor:not-allowed}.primary{background:#245a45;color:white}.danger{color:#a32e2e}.panel{background:white;border:1px solid #e0e6e8;border-radius:10px;padding:18px;margin:20px 0}.filters{margin-bottom:16px}.actions{justify-content:space-between;margin-bottom:12px}.scroll{overflow:auto}table{border-collapse:collapse;width:100%;min-width:650px;font-size:14px}td,th{border-bottom:1px solid #e5eaed;padding:12px;text-align:left}th{font-size:12px;color:#637077}td button{font-size:12px;padding:5px 8px}.title{font-weight:600;max-width:520px}.tab.active{background:#245a45;color:white}#notice{min-height:18px}input[type=checkbox]{width:16px;height:16px}#token{width:min(420px,100%)}.hidden{display:none}#editor{margin-top:20px}#editor input,#editor select{width:100%}label{display:block;font-size:12px;color:#526268;margin:8px 0}.field{margin:10px 0}.page{display:flex;gap:7px;justify-content:center;margin:20px}small{color:#7a898f}
</style></head><body><div class="wrap"><header><div><h1>정보세상 글관리</h1><p>카테고리별 게시글 · 선택 수정 · 휴지통 · 복원</p></div><a href="/admin/">기존 글쓰기 관리자로 이동 ↗</a></header>
<section class="panel" id="auth"><strong>GitHub 저장소 연결</strong><p>저장소에 대한 Contents 읽기·쓰기 권한이 있는 GitHub 토큰을 입력하세요. 토큰은 저장되지 않으며 이 탭에서만 사용합니다. 공용 PC에서는 사용하지 마세요.</p><div class="toolbar"><input type="password" id="token" autocomplete="off" placeholder="GitHub fine-grained token"><button class="primary" id="connect">연결</button><button id="disconnect" disabled>연결 해제</button></div></section>
<section class="panel hidden" id="manager"><div class="filters"><button class="tab active" data-status="published">공개</button><button class="tab" data-status="draft">임시저장</button><button class="tab" data-status="trash">휴지통</button><select id="category"></select><input id="search" type="search" placeholder="제목/키워드 검색"><select id="perpage"><option>10</option><option>30</option><option>50</option></select><button id="refresh">새로고침</button></div>
<div class="actions"><span id="count">0개의 글</span><div class="toolbar"><button id="bulkEdit">선택 카테고리 변경</button><button id="bulkTrash" class="danger">선택 휴지통 이동</button><button id="bulkRestore">선택 복원</button></div></div>
<p id="notice" role="status" aria-live="polite"></p>
<div class="scroll"><table><thead><tr><th><input type="checkbox" id="all" aria-label="현재 페이지 전체 선택"></th><th>글 제목</th><th>카테고리</th><th>작성일</th><th>상태</th><th>관리</th></tr></thead><tbody id="rows"></tbody></table></div><div class="page" id="pages"></div>
<div id="editor" class="panel hidden"><h2 style="font-size:18px">게시글 수정</h2><div class="field"><label>제목<input id="editTitle"></label></div><div class="field"><label>카테고리<select id="editCategory"></select></label></div><div class="toolbar"><button class="primary" id="saveEdit">수정 저장</button><button id="cancelEdit">취소</button></div></div>
</section></div>
<script>
(()=>{'use strict';
const REPO='hwsr6028-source/skin-map',DIR='content/posts',categories={health:'병원·건강',law:'법률',interior:'인테리어',moving:'이사·생활',realestate:'부동산',finance:'금융·경제',tech:'IT·디지털',education:'교육·취업',travel:'여행·취미',general:'기타',fortune:'점집',tattoo:'타투',shopping:'구매대행',supplements:'건강식품',dermatology:'기존 피부과',lifting:'기존 리프팅',skinbooster:'기존 스킨부스터',other:'기존 기타'};
const $=id=>document.getElementById(id);let token='',records=[],status='published',page=1,edit=null;const selected=new Set();
function message(s){$('notice').textContent=s}
function catSelect(sel,all){sel.replaceChildren();if(all)sel.add(new Option('전체 카테고리',''));Object.entries(categories).forEach(([k,v])=>sel.add(new Option(v,k)))}
catSelect($('category'),true);catSelect($('editCategory'),false);
async function api(path,options={}){const r=await fetch('https://api.github.com/repos/'+REPO+'/'+path,{...options,headers:{Accept:'application/vnd.github+json',Authorization:'Bearer '+token,'X-GitHub-Api-Version':'2022-11-28',...(options.headers||{})}});if(!r.ok)throw Error('GitHub API '+r.status+': '+(await r.text()).slice(0,130));return r.json()}
function encodePath(path){return path.split('/').map(encodeURIComponent).join('/')}
function decode64(s){const chars=atob(s.replace(/\s/g,''));return new TextDecoder().decode(Uint8Array.from(chars,c=>c.charCodeAt(0)))}
function encode64(s){const bytes=new TextEncoder().encode(s);let bin='';for(let i=0;i<bytes.length;i+=8192)bin+=String.fromCharCode(...bytes.slice(i,i+8192));return btoa(bin)}
async function load(){message('게시글 목록을 불러오는 중입니다.');selected.clear();records=[];const files=await api('contents/'+DIR+'?ref=main');const list=files.filter(f=>f.type==='file'&&f.name.endsWith('.json'));for(let i=0;i<list.length;i+=12){const batch=await Promise.all(list.slice(i,i+12).map(async f=>{try{const v=await api('contents/'+encodePath(f.path)+'?ref=main');return {path:f.path,sha:v.sha,data:JSON.parse(decode64(v.content))}}catch(e){return null}}));records.push(...batch.filter(Boolean));message('게시글 '+records.length+'건 확인 중...')}message('전체 '+records.length+'건을 불러왔습니다.');render()}
function visible(){let q=$('search').value.trim().toLowerCase(),cat=$('category').value;return records.filter(x=>(x.data.status||'draft')===status&&(!cat||x.data.category===cat)&&(!q||String(x.data.title||'').toLowerCase().includes(q)||String(x.data.keyword||'').toLowerCase().includes(q))).sort((a,b)=>String(b.data.updated_at||b.data.date||'').localeCompare(String(a.data.updated_at||a.data.date||'')))}
function render(){const v=visible(),per=Number($('perpage').value),max=Math.max(1,Math.ceil(v.length/per));page=Math.min(page,max);$('count').textContent=v.length+'개의 글 · '+selected.size+'개 선택';$('rows').replaceChildren();for(const x of v.slice((page-1)*per,page*per)){let tr=document.createElement('tr'),check=document.createElement('input');check.type='checkbox';check.checked=selected.has(x.path);check.addEventListener('change',()=>{check.checked?selected.add(x.path):selected.delete(x.path);renderCount()});let a=document.createElement('a');a.className='title';a.textContent=x.data.title||x.path;a.href='/blog/'+encodeURIComponent(x.data.slug||x.path.split('/').pop().replace(/\.json$/,''))+'/';a.target='_blank';let editButton=document.createElement('button');editButton.textContent='수정';editButton.addEventListener('click',()=>openEdit(x));for(let child of [check,a,document.createTextNode(categories[x.data.category]||x.data.category||'기타'),document.createTextNode(String(x.data.date||'').slice(0,10)),document.createTextNode(status==='trash'?'복원 가능':status==='draft'?'임시저장':'공개'),editButton]){let td=document.createElement('td');td.append(child);tr.append(td)}$('rows').append(tr)}$('pages').replaceChildren();for(const [label,p] of [['이전',page-1],[page+'/'+max,page],['다음',page+1]]){const b=document.createElement('button');b.textContent=label;b.disabled=p<1||p>max||label===page+'/'+max;b.onclick=()=>{page=p;render()};$('pages').append(b)}$('bulkTrash').disabled=status==='trash'||!selected.size;$('bulkRestore').disabled=status!=='trash'||!selected.size;$('bulkEdit').disabled=!selected.size}
function renderCount(){$('count').textContent=visible().length+'개의 글 · '+selected.size+'개 선택';$('bulkTrash').disabled=status==='trash'||!selected.size;$('bulkRestore').disabled=status!=='trash'||!selected.size;$('bulkEdit').disabled=!selected.size}
async function saveRecord(x,mutate){const file=await api('contents/'+encodePath(x.path)+'?ref=main');let data=JSON.parse(decode64(file.content));mutate(data);const result=await api('contents/'+encodePath(x.path),{method:'PUT',headers:{'Content-Type':'application/json'},body:JSON.stringify({message:'Manage article: '+x.path,content:encode64(JSON.stringify(data,null,2)+'\n'),sha:file.sha,branch:'main'})});x.data=data;x.sha=result.content.sha}
async function bulk(handler,label){const items=records.filter(x=>selected.has(x.path));if(!items.length)return; if(!confirm(items.length+'개 글을 '+label+'하시겠습니까?'))return;message(label+' 진행 중...');let completed=0;for(const x of items){try{await saveRecord(x,handler);completed++}catch(e){message('일부 실패: '+e.message);break}}selected.clear();await load();message(label+' 완료: '+completed+'건. GitHub 배포 후 사이트에 반영됩니다.')}
function openEdit(x){edit=x;$('editTitle').value=x.data.title||'';$('editCategory').value=x.data.category||'general';$('editor').classList.remove('hidden');$('editor').scrollIntoView({behavior:'smooth'})}
$('saveEdit').onclick=async()=>{if(!edit)return;const title=$('editTitle').value.trim();if(!title)return alert('제목을 입력하세요');try{await saveRecord(edit,d=>{d.title=title;d.category=$('editCategory').value});$('editor').classList.add('hidden');render();message('수정했습니다.')}catch(e){message(e.message)}};
$('cancelEdit').onclick=()=>$('editor').classList.add('hidden');
$('connect').onclick=async()=>{token=$('token').value.trim();if(!token)return;try{await api('contents/'+DIR+'?ref=main');$('token').value='';$('manager').classList.remove('hidden');$('disconnect').disabled=false;await load()}catch(e){message(e.message);alert(e.message);token=''}};
$('disconnect').onclick=()=>{token='';records=[];selected.clear();$('manager').classList.add('hidden');$('disconnect').disabled=true;message('연결 해제되었습니다.')};
document.querySelectorAll('.tab').forEach(b=>b.onclick=()=>{document.querySelectorAll('.tab').forEach(t=>t.classList.toggle('active',t===b));status=b.dataset.status;selected.clear();page=1;render()});
for(let k of ['category','perpage','search'])$(k).addEventListener(k==='search'?'input':'change',()=>{page=1;selected.clear();render()});
$('refresh').onclick=load;$('all').onchange=e=>{const v=visible(),per=Number($('perpage').value);v.slice((page-1)*per,page*per).forEach(x=>e.target.checked?selected.add(x.path):selected.delete(x.path));render()};
$('bulkTrash').onclick=()=>bulk(d=>{d.status='trash';d.deleted_at=new Date().toISOString()},'휴지통으로 이동');
$('bulkRestore').onclick=()=>bulk(d=>{d.status='published';delete d.deleted_at},'복원');
$('bulkEdit').onclick=()=>{let choices=Object.entries(categories).map(([k,v])=>k+' : '+v).join('\n');let cat=prompt('변경할 카테고리 코드를 입력하세요:\n'+choices);if(!cat)return;if(!categories[cat])return alert('올바른 카테고리를 선택하세요');bulk(d=>{d.category=cat},'카테고리 변경')};
})();
</script></body></html>
